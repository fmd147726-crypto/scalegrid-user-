        <p id="announcement-message"></p>
        <a id="announcement-link" class="announcement-action" hidden target="_blank" rel="noopener noreferrer">Learn more <span aria-hidden="true">↗</span></a>

      </nav>
      <a class="header-cta" id="header-cta" href="#contact">Let's talk <span>↗</span></a>
    </div>

  <main id="site-main">
    <section class="loading-state wrap" aria-live="polite">
      <div class="loading-orbit"><span></span><span></span><span></span></div>
      <p>Connecting to ScaleGrid…</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-top">
      <div class="footer-brand-block">
        <a class="brand" href="#home"><span class="brand-mark"><span></span><span></span><span></span></span><span id="footer-brand-name">ScaleGrid</span></a>

      </div>
      <div class="footer-links-wrap">
        <div><span class="footer-label">Explore</span><nav id="footer-nav" class="footer-links"></nav></div>
        <div><span class="footer-label">Connect</span><div id="footer-socials" class="footer-links"></div></div>

    </div>
    <div class="wrap footer-bottom"><span id="copyright">© <span id="year"></span> ScaleGrid. All rights reserved.</span><span class="footer-note">Built for what comes next.</span></div>
